<title>Samhällssimulatorn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: kartan fyller vänster yta, en smal journalpanel till höger; på mobil staplas de. */
:root {
  --bg: #e3e6df; --panel: #f1f3ee; --fg: #1e2420; --muted: #5d6860; --line: #c7cdc4;
  --accent: #b5701a; --accent-fg: #ffffff; --good: #4f8a4a; --bad: #b8483b; --barbg: #d6dbd3;
  --display: "Grenze", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131816; --panel: #1b221f; --fg: #e2e6df; --muted: #93a096; --line: #2c3530;
  --accent: #e3a045; --accent-fg: #1b1408; --good: #7dbb72; --bad: #e07a6c; --barbg: #2a332e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131816; --panel: #1b221f; --fg: #e2e6df; --muted: #93a096; --line: #2c3530;
  --accent: #e3a045; --accent-fg: #1b1408; --good: #7dbb72; --bad: #e07a6c; --barbg: #2a332e; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-block: 12px; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; margin: 0; letter-spacing: 0.01em; }
.cal { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.cal b { color: var(--fg); font-weight: 700; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; border-radius: 6px; overflow: hidden; background: #1d2420; }
#map { position: absolute; inset: 0; }
#map canvas { display: block; touch-action: manipulation; }
.chips { position: absolute; right: 10px; top: 72px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.chips button.chip { pointer-events: auto; border: 0; font: inherit; font-size: 13px; cursor: pointer; }
/* invånarna överst på kartan, som i RimWorld */
.ports { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.port { flex: none; width: 92px; display: grid; grid-template-columns: 14px minmax(0, 1fr); grid-template-areas: "d n" "i i" "a a"; gap: 0 5px; align-items: center; text-align: left;
  background: rgba(18, 22, 20, 0.72); color: #eef1ec; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; line-height: 1.25; cursor: pointer; }
.port:hover { background: rgba(18, 22, 20, 0.9); }
.port[aria-pressed="true"] { border-color: #f0c070; }
.port .dot { grid-area: d; width: 12px; height: 12px; }
.port .pn { grid-area: n; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port .pi { grid-area: i; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port .pa { grid-area: a; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port.low .pn::after { content: " !"; color: #ff9a8a; }
.tip { position: absolute; z-index: 5; width: 210px; background: rgba(18, 22, 20, 0.92); color: #eef1ec; border-radius: 6px; padding: 8px 10px; font-size: 13px; pointer-events: none; }
.tip h4 { margin: 0; font-size: 14px; }
.tip p { margin: 2px 0 0; }
.tip .op { opacity: 0.75; }
.tip dl { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 2px 8px; margin: 6px 0 0; align-items: center; }
.tip dd { margin: 0; }
.tip .bar { width: 100%; background: rgba(255,255,255,0.15); }
/* lista till vänster över allt byn äger */
.owned { position: absolute; left: 10px; top: 72px; width: 170px; max-height: calc(100% - 170px); overflow-y: auto; background: none; color: #f4f6f2; text-shadow: 0 1px 2px #000, 0 0 3px #000; padding: 0 2px; font-size: 12px; line-height: 1.4; scrollbar-width: thin; }
.owned h4 { margin: 0 0 3px; font-size: 12px; opacity: 0.8; font-weight: 700; }
.owned .fold { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; font-weight: 700; padding: 2px 0; cursor: pointer; }
.owned .fold .n { float: right; font-weight: 400; opacity: 0.8; }
.owned ul { list-style: none; margin: 0 0 2px; padding: 0 0 0 12px; }
.owned li { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.owned li span:first-child { display: flex; align-items: center; gap: 5px; }
.ikon { image-rendering: pixelated; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)); }
.kv.stk dt { display: flex; align-items: center; gap: 6px; }
.owned .n { font-variant-numeric: tabular-nums; }
.owned p { margin: 2px 0 0; opacity: 0.8; }
/* rutan som visar vad musen är över */
.hoverBox { position: absolute; left: 10px; bottom: 10px; max-width: min(260px, calc(100% - 140px)); background: rgba(18, 22, 20, 0.6); color: #eef1ec; border-radius: 4px; padding: 6px 9px; font-size: 12px; line-height: 1.35; pointer-events: none; }
.hoverBox b { font-weight: 700; }
.hoverBox p { margin: 0; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { font: inherit; font-size: 14px; font-weight: 700; min-width: 32px; height: 32px; border-radius: 4px; border: 0; background: rgba(18, 22, 20, 0.72); color: #eef1ec; cursor: pointer; padding: 0 10px; }
.zoom button:hover { background: rgba(18, 22, 20, 0.9); }
.filters { position: absolute; right: 10px; bottom: 50px; display: flex; flex-direction: column; gap: 4px; }
.filters button { width: 32px; height: 32px; border-radius: 4px; border: 0; background: rgba(18, 22, 20, 0.72); cursor: pointer; display: grid; place-items: center; padding: 0; }
.filters button:hover { background: rgba(18, 22, 20, 0.9); }
.filters button[aria-pressed="true"] { outline: 2px solid #f0c070; }
.legend { position: absolute; right: 50px; bottom: 50px; background: rgba(18, 22, 20, 0.6); border-radius: 4px; padding: 5px 7px; display: flex; flex-direction: column; gap: 3px; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.chip { background: rgba(18, 22, 20, 0.72); color: #eef1ec; border-radius: 4px; padding: 4px 9px; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 700; margin-right: 3px; }
.chip span { opacity: 0.75; margin-left: 4px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 10px 6px 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 700; }
#panelBody { overflow-y: auto; padding: 12px 14px 16px; min-width: 0; }
.muted { color: var(--muted); }
ul, ol { list-style: none; margin: 0; padding: 0; }
.folk li + li { border-top: 1px solid var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "d n a" ". t b"; gap: 1px 8px; align-items: center; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 7px 2px; cursor: pointer; border-radius: 4px; }
.row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row .dot { grid-area: d; }
.row .nm { grid-area: n; font-weight: 700; }
.row .age { grid-area: a; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .act { grid-area: t; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rb { grid-area: b; display: flex; align-items: center; justify-content: flex-end; }
.row .bar { width: 70px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,0.35); }
.dot.big { width: 22px; height: 22px; flex: none; margin-top: 6px; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--barbg); overflow: hidden; vertical-align: middle; }
.bar > span { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.bar.low > span { background: var(--bad); }
.bar.skill > span { background: var(--accent); }
.trend { font-size: 9px; margin-left: 3px; vertical-align: middle; line-height: 1; }
.trend.up { color: var(--good); }
.trend.down { color: var(--bad); }
.tag { color: var(--accent); font-weight: 500; font-size: 12px; margin: 0; }
.tag.sjuk { color: var(--bad); }
.why { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-style: italic; }
.small { font-size: 12px; margin: 4px 0 0; }
.seder li { padding: 10px 0; border-top: 1px solid var(--line); }
.tekhead { display: flex; justify-content: flex-end; }
.hjalp { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 0; }
.hjalp[aria-expanded="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ttrad { position: relative; margin: 4px 0 8px; }
.tlinjer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tlinjer line { stroke: var(--line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.tlinjer line.krav { stroke: var(--muted); }
.tlinjer line.mat { stroke: var(--muted); stroke-dasharray: 4 3; }
.tnod { position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tnod .ikon { image-rendering: pixelated; }
.tnod.rot { width: 34px; height: 34px; border-style: dashed; }
.tnod.ok .ikon { opacity: 0.35; filter: grayscale(1); }
.tnod.pa .ikon { opacity: 0.6; }
.tnod.kan { border-color: var(--good); }
.tnod.sel { box-shadow: 0 0 0 3px var(--accent); }
.tnod .ring { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); pointer-events: none; }
.tnod .ring circle { fill: none; stroke: var(--accent); stroke-width: 3; }
.tnod .antal { position: absolute; right: -6px; bottom: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--good); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px; }
.tnod .brist { position: absolute; left: -6px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 11px; line-height: 16px; text-align: center; font-weight: bold; }
.tekrad { display: flex; flex-wrap: wrap; gap: 8px; }
.tnod.liten { position: relative; transform: none; width: 30px; height: 30px; }
.tinfo { border-top: 1px solid var(--line); padding-top: 8px; }
.tektop { display: flex; align-items: center; gap: 8px; }
.tektop .ikon { image-rendering: pixelated; }
.tmat { margin-left: auto; display: flex; align-items: center; gap: 3px; }
.tmat i { color: var(--muted); font-style: normal; font-size: 12px; }
.tmat .saknas { opacity: 0.35; filter: grayscale(1); }
.tinfo .kan { color: var(--good); font-size: 13px; }
.tinfo .tank { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; font-size: 13px; margin-top: 4px; }
.sedtop { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.sbar { display: block; position: relative; height: 8px; border-radius: 4px; background: var(--barbg); }
.sbar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.sbar > span { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.sedw { margin: 6px 0 0; font-weight: 700; }
.logg li { padding: 7px 0; border-top: 1px solid var(--line); }
.logg li:first-child { border-top: 0; }
.when { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.logg .k-death { color: var(--bad); }
.logg .k-death .when { color: var(--muted); }
.logg .k-world { font-style: italic; }
.plink { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent); text-underline-offset: 2px; cursor: pointer; }
.phead { display: flex; gap: 10px; align-items: flex-start; }
.phead h2 { font-family: var(--display); font-size: 1.5rem; margin: 0; line-height: 1.1; }
.phead p { margin: 2px 0 0; }
.status { font-weight: 500; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
.kv { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 4px 10px; margin: 0; align-items: center; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.kv dd .bar { flex: 1; max-width: 140px; }
.kv.fam dd { display: block; }
.kv.stk { grid-template-columns: max-content minmax(0, 1fr); }
.thoughts { margin-top: 8px; display: grid; gap: 3px; }
.thoughts li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.thoughts .pos span { color: var(--good); } .thoughts .neg span { color: var(--bad); }
.rels li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; padding: 3px 0; }
.rw.pos { color: var(--good); } .rw.neg { color: var(--bad); }
.lard li { padding: 4px 0; } .lard li > span { display: block; padding-left: 10px; } .lard small { display: block; font-size: 11px; }
.lard .fel { color: var(--bad); } .lard .fel::before { content: "⚠ "; } .lard li.fara { color: var(--warn, #e0a050); }
.fame li::before { content: "◆ "; color: var(--accent); }
.controls { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
#speeds { display: flex; gap: 4px; flex-wrap: wrap; }
#speeds button, .ghost, .primary { font: inherit; font-size: 13px; border-radius: 4px; padding: 4px 9px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
#speeds button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; padding: 7px 14px; font-size: 15px; }
.spacer { flex: 1; }
#confirmNew { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.testing .mapwrap { box-shadow: 0 0 0 3px var(--accent); }
#overlay, #loading { position: fixed; inset: 0; background: rgba(10, 14, 12, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.card { background: var(--panel); color: var(--fg); border-radius: 8px; padding: 20px 22px; width: min(460px, 100%); max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.35); box-sizing: border-box; }
.card h2 { font-family: var(--display); font-size: 1.6rem; margin: 0 0 4px; }
.ovLead { font-size: 1.1rem; margin: 0 0 6px; }
.prog { height: 8px; border-radius: 4px; background: var(--barbg); overflow: hidden; margin: 12px 0 6px; }
#progBar { height: 100%; width: 0; background: var(--accent); transition: width 0.1s linear; }
.sumList { margin: 12px 0 16px; display: grid; gap: 8px; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { aspect-ratio: 1.15; max-width: 100%; }
  .chip { font-size: 12px; padding: 3px 7px; }
  .chips { top: 66px; }
  .port { width: 78px; }
  .hoverBox, .owned { display: none; }
  aside { min-height: 420px; }
  #panelBody { max-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) { #progBar { transition: none; } }
</style>

<div class="app">
  <header>
    <h1>Samhällssimulatorn</h1>
    <div class="cal" aria-live="polite"><b id="calYear">År 1</b><span id="calAge">Vårtid</span><span id="calTime"></span><span id="calTemp" title="Temperatur just nu"></span></div>
  </header>
  <div class="main">
    <section class="mapwrap" aria-label="Karta över byn">
      <div id="map"></div>
      <div id="ports" class="ports" aria-label="Invånare"></div>
      <div id="portTip" class="tip" hidden></div>
      <div id="hoverBox" class="hoverBox" hidden></div>
      <div id="owned" class="owned" aria-label="Allt byn äger"></div>
      <div class="chips">
        <button type="button" class="chip" id="followChip" hidden></button>
      </div>
      <div id="filters" class="filters" aria-label="Filter på kartan"></div>
      <div id="legend" class="legend" hidden></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zooma in">+</button>
        <button type="button" id="zOut" aria-label="Zooma ut">−</button>
        <button type="button" id="zHome">Byn</button>
      </div>
    </section>
    <aside>
      <nav class="tabs" role="tablist"></nav>
      <div id="panelBody"></div>
      <div class="controls">
        <label class="switch"><input type="checkbox" id="testToggle"> Testläge</label>
        <div id="speeds" hidden>
          <button type="button" data-v="1">1×</button>
          <button type="button" data-v="60">1 min/s</button>
          <button type="button" data-v="3600">1 tim/s</button>
          <button type="button" data-v="86400">1 år/s</button>
        </div>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="newVillage">Ny by</button>
        <div id="confirmNew" hidden>
          <span>Den nuvarande byn försvinner för gott.</span>
          <button type="button" class="ghost" id="cancelNew">Avbryt</button>
          <button type="button" class="primary" id="okNew">Starta ny by</button>
        </div>
      </div>
    </aside>
  </div>
</div>
<div id="loading"><div class="card"><h2>Samhällssimulatorn</h2><p class="muted">Letar efter din by…</p></div></div>
<div id="overlay" hidden><div class="card"><h2>Välkommen tillbaka</h2><div id="ovBody"></div></div></div>
<script>/*BUNDLE*/</script>
