<title>Samhällssimulatorn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Layout (steg 5.3.1.1): kartan täcker hela skärmen under raden överst, och panelerna ligger ovanpå: personens panel till
   vänster, den öppna flikens panel till höger och flikknapparna i en kolumn längst till höger. */
:root {
  /* Ljust och mörkt läge (steg 5.3.1.3): grundens färger i två uppsättningar ur paletten (palett.ts). Ljust: beige (benets
     toner) och kol. Mörkt: kolets toner med en ljusare innerkant på rutorna. Flikarnas egna färger är desamma i båda.
     Ljust är standard; knappen under ⚙ byter, och valet sparas i webbläsaren (data-tema på html) */
  --bg: #bdb39b; --panel: #dad0bb; --fg: #24201d; --muted: #5e3c24; --line: #a0947d; --inner: transparent; --tartblek: #a0947d;
  --accent: #a14808; --accent-fg: #dad0bb; --good: #4b4f00; --bad: #742a01; --barbg: #bdb39b; color-scheme: light;
  --display: "Silkscreen", "Pixelify Sans", monospace; /* pixeltypsnitten (steg 5.3.2.3, Björn): Silkscreen i rubrikerna */
  --body: "Pixelify Sans", "Segoe UI", system-ui, sans-serif; /* och Pixelify Sans i all brödtext */
}
:root[data-tema="morkt"] {
  --bg: #24201d; --panel: #2f261d; --fg: #dad0bb; --muted: #a0947d; --line: #474138; --inner: #474138; --tartblek: #474138;
  --accent: #d8b25f; --accent-fg: #24201d; --good: #898b4c; --bad: #bd753e; --barbg: #372f25; color-scheme: dark;
}
header, .tabs, .controls { box-shadow: inset 0 0 0 1px var(--inner); }
.controls { box-shadow: inset 0 0 0 1px var(--inner), 0 6px 24px rgba(36, 32, 29, 0.35); }
/* Ramen på panelerna (steg 5.3.1.4), som hörnet Ormen i bildstilen: kol, grått, grått, kol på sidorna och två punkter kol
   överst och nederst. Hörnen (ui/ram.ts) ligger ovanpå och sticker ut utanför ramen */
.panel { border: 2px solid #24201d; border-left-width: 1px; border-right-width: 1px; border-radius: 0;
  box-shadow: inset 2px 0 0 #474138, inset -2px 0 0 #474138, inset 3px 0 0 #24201d, inset -3px 0 0 #24201d, 0 6px 24px rgba(36, 32, 29, 0.35); }
.panel > .horn { position: absolute; z-index: 2; width: var(--horn-w); height: var(--horn-h); pointer-events: none; image-rendering: pixelated; background-repeat: no-repeat; }
.panel > .horn.tv { left: calc(-1px - var(--horn-x)); top: calc(-2px - var(--horn-y)); background-image: var(--horn-tv); }
.panel > .horn.th { right: calc(-1px - var(--horn-x)); top: calc(-2px - var(--horn-y)); background-image: var(--horn-th); }
.panel > .horn.nv { left: calc(-1px - var(--horn-x)); bottom: calc(-2px - var(--horn-y)); background-image: var(--horn-nv); }
.panel > .horn.nh { right: calc(-1px - var(--horn-x)); bottom: calc(-2px - var(--horn-y)); background-image: var(--horn-nh); }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4; box-sizing: border-box; --topp: 59px; --stenar: 64px; }
.app { height: 100%; }
header { position: fixed; left: 0; right: 0; top: 0; height: var(--topp); box-sizing: border-box; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 18px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); overflow: hidden; }
h1 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: 0; } /* Silkscreen i hela punkter: 8, 16 och 24 */
.cal { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.cal b { color: var(--fg); font-weight: 700; }
/* Raden överst (steg 5.3.1.2, ui/raden.ts): tidsstaven med årstiden, nyckeltalen i platta rutor med en pixelsymbol och ett
   tal, och vågbandet längst ner mot kartan (Björns g_vag, upprepat i hel skala) */
header { padding-bottom: calc(6px + var(--vag-h, 0px)); }
header { flex-wrap: nowrap; } header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
header .cal { flex-wrap: nowrap; align-items: center; white-space: nowrap; }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--vag-h, 0px); background: var(--vag) repeat-x; image-rendering: pixelated; }
.tidsstav { display: inline-flex; align-items: center; gap: 6px; }
.stav { display: inline-flex; gap: 1px; padding: 1px; background: #24201d; }
.stav i { width: 4px; height: 8px; background: #474138; } .stav i.f { background: #a0947d; } .stav i.nu { background: #d8b25f; }
.nycklar { display: inline-flex; gap: 6px; align-items: center; }
.nyckel { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); line-height: 18px; }
.nyckel img { image-rendering: pixelated; vertical-align: middle; }
.calknapp { font: inherit; color: inherit; background: none; border: 0; padding: 0 4px; }
.nyckel.calknapp { padding: 1px 5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); } .calknapp { border-radius: 3px; cursor: pointer; } .calknapp:hover, .calknapp[aria-expanded="true"] { color: var(--fg); box-shadow: inset 0 -2px var(--accent); }
.mapwrap { position: fixed; left: 0; right: 0; top: var(--topp); bottom: 0; overflow: hidden; background: #1d2420; }
#map { position: absolute; inset: 0; }
#map canvas { display: block; touch-action: none; } /* fingrarna flyttar och zoomar kartan, inte sidan (steg 5.3.7) */
.chips { position: absolute; right: calc(var(--stenar) + 10px); top: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.chips button.chip { pointer-events: auto; border: 0; font: inherit; font-size: 13px; cursor: pointer; }
/* folket längst ner på kartan (steg 5.3.3.4) */
.ports { position: absolute; left: 8px; right: calc(var(--stenar) + 8px); bottom: 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.port { flex: none; width: 92px; display: grid; grid-template-columns: 32px minmax(0, 1fr); grid-template-areas: "d n" "d i" "a a"; gap: 0 5px; align-items: center; text-align: left;
  background: rgba(18, 22, 20, 0.72); color: #eef1ec; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; line-height: 1.25; cursor: pointer; }
.port:hover { background: rgba(18, 22, 20, 0.9); }
.port[aria-pressed="true"] { border-color: #f0c070; }
.port .pf { grid-area: d; width: 32px; height: 32px; }
.port .pn { grid-area: n; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port .pi { grid-area: i; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port .pa { grid-area: a; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port.low .pn::after { content: " !"; color: #ff9a8a; }
.tip { position: absolute; z-index: 5; width: 210px; background: rgba(18, 22, 20, 0.92); color: #eef1ec; border-radius: 6px; padding: 8px 10px; font-size: 13px; pointer-events: none; }
.trycktips { position: fixed; z-index: 20; white-space: pre-line; width: auto; max-width: min(280px, calc(100vw - 16px)); }
.tip h4 { margin: 0; font-size: 16px; font-family: var(--display); font-weight: 400; }
.tip p { margin: 2px 0 0; }
.tip .op { opacity: 0.75; }
.tip dl { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 2px 8px; margin: 6px 0 0; align-items: center; }
.tip dd { margin: 0; }
.tip .bar { width: 100%; }
/* lista till vänster över allt byn äger */
/* Förrådet öppnas med rikedomen i sidhuvudet (steg 5.3.3.4) */
.owned { position: absolute; left: 10px; top: 12px; width: 170px; max-height: calc(100% - 110px); display: none; overflow-y: auto; background: none; color: #f4f6f2; text-shadow: 0 1px 2px #000, 0 0 3px #000; padding: 0 2px; font-size: 12px; line-height: 1.4; scrollbar-width: thin; }
.owned h4 { margin: 0 0 3px; font-size: 16px; opacity: 0.8; font-family: var(--display); font-weight: 400; }
.owned .fold { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; font-weight: 700; padding: 2px 0; cursor: pointer; }
.owned .fold .n { float: right; font-weight: 400; opacity: 0.8; }
.owned ul { list-style: none; margin: 0 0 2px; padding: 0 0 0 12px; }
/* en sak per rad: symbolen och antalet */
.owned li { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.sakval { display: inline-flex; align-items: center; gap: 1px; margin-right: 4px; } .sakval small { font-size: .75em; opacity: .8; }
.ikon { image-rendering: pixelated; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)); }
img.ikon.sym { vertical-align: middle; } /* emojierna som pixelsymboler i hel skala (steg 5.3.2.1) */
/* fryst mat i lagret: en vit och ljusblå kant av rimfrost runt symbolen (Björn valde rimfrosten efter v89) */
.fryst .ikon { filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 1px 0 #c4e2f8); }
.kv.stk dt { display: flex; align-items: center; gap: 6px; }
.owned .n { font-variant-numeric: tabular-nums; }
.owned p { margin: 2px 0 0; opacity: 0.8; }
/* rutan som visar vad musen är över */
.hoverBox { position: absolute; left: 10px; bottom: 72px; max-width: min(260px, calc(100% - 140px)); background: rgba(18, 22, 20, 0.6); color: #eef1ec; border-radius: 4px; padding: 6px 9px; font-size: 12px; line-height: 1.35; pointer-events: none; }
.hoverBox b { font-weight: 700; }
.hoverBox p { margin: 0; }
.zoom { position: absolute; right: calc(var(--stenar) + 10px); bottom: 72px; z-index: 1; display: flex; gap: 4px; }
.zoom button { font: inherit; font-size: 14px; font-weight: 700; min-width: 32px; height: 32px; border-radius: 4px; border: 0; background: rgba(18, 22, 20, 0.72); color: #eef1ec; cursor: pointer; padding: 0 10px; }
.zoom button:hover { background: rgba(18, 22, 20, 0.9); }
.filters { position: absolute; right: calc(var(--stenar) + 10px); top: 50%; transform: translateY(-50%); z-index: 1; display: flex; flex-direction: column; gap: 4px; }
.filters button { width: 32px; height: 32px; border-radius: 4px; border: 0; background: rgba(18, 22, 20, 0.72); cursor: pointer; display: grid; place-items: center; padding: 0; }
.filters button:hover { background: rgba(18, 22, 20, 0.9); }
.filters button[aria-pressed="true"] { outline: 2px solid #f0c070; }
.legend { position: absolute; right: calc(var(--stenar) + 50px); top: 50%; transform: translateY(-50%); z-index: 1; background: rgba(18, 22, 20, 0.6); border-radius: 4px; padding: 5px 7px; display: flex; flex-direction: column; gap: 3px; }
/* kartans knappar (steg 5.3.6): zoomen i det nedre högra hörnet, filtren för sig mitt på högra kanten, och båda till vänster om den högra panelen när den är öppen */
body.hOppen .zoom, body.hOppen .filters { right: calc(var(--stenar) + 14px + min(360px, 100vw - var(--stenar) - 24px) + 10px); }
body.hOppen .legend { right: calc(var(--stenar) + 14px + min(360px, 100vw - var(--stenar) - 24px) + 50px); }
@media (max-width: 760px) { body.hOppen .zoom, body.hOppen .filters, body.hOppen .legend { display: none; } } /* ingen plats bredvid panelen på en smal skärm (steg 5.3.7) */
.legend button { display: flex; align-items: center; gap: 5px; background: none; border: 0; padding: 2px 3px; border-radius: 3px; cursor: pointer; }
.legend button:hover { background: rgba(255, 255, 255, 0.12); }
.legend button[aria-pressed="true"] { outline: 2px solid #f0c070; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.chip { background: rgba(18, 22, 20, 0.72); color: #eef1ec; border-radius: 4px; padding: 4px 9px; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 700; margin-right: 3px; }
.chip span { opacity: 0.75; margin-left: 4px; }
/* panelerna ovanpå kartan, med ett kryss som stänger dem */
.panel { position: fixed; z-index: 2; top: calc(var(--topp) + 12px); bottom: 72px; width: 360px; max-width: calc(100vw - var(--stenar) - 24px); box-sizing: border-box; background: var(--panel); display: grid; grid-template-rows: minmax(0, 1fr); }
.panel.vanster { left: 16px; }
.panel.hoger { right: calc(var(--stenar) + 14px); }
/* rutan för det man trycker på kommer fram där man tryckte (steg 5.3.5.1) */
.panel.ruta { z-index: 3; bottom: auto; width: 300px; max-height: min(62vh, 520px); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.graf { margin: 10px 0 6px; border: 1px solid var(--line); background: var(--bg); padding: 6px 8px 4px; } /* graferna (steg 5.4.1, ui/graf.ts) */
.grafhuvud { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.grafnamn { font-weight: bold; margin-right: auto; }
.grafserie { display: inline-flex; align-items: center; gap: 4px; }
.grafserie i { width: 10px; height: 3px; display: inline-block; }
.grafallt { font: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.grafallt[aria-pressed="true"] { background: var(--line); }
.grafyta { display: block; width: 100%; height: 64px; margin-top: 4px; touch-action: pan-y; }
.grafyta.dra { cursor: ew-resize; }
.grafaxel { stroke: var(--line); stroke-width: 1; }
.grafaxlar { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; color: var(--muted); }
.grafram { position: relative; }
.grafmax { position: absolute; left: 2px; top: 0; font-size: 10px; color: var(--muted); pointer-events: none; }
.greppa { display: none; } /* greppet överst i arket syns bara på en liten skärm (steg 5.3.7) */
.panel > .stang { position: absolute; top: 14px; right: 12px; z-index: 1; width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
.panel > .stang:hover { color: var(--fg); }
.panelkropp { overflow-y: auto; padding: 12px 14px 16px; min-width: 0; }
.panelkropp > :first-child { margin-right: 30px; } /* plats för krysset */
body.forradOppen .owned { display: block; }
body.vOppen .owned { display: none; }
/* flikknapparna i en kolumn längst till höger (runstenarna i steg 5.3.3.1) */
.tabs { position: fixed; z-index: 2; right: 0; top: var(--topp); bottom: 0; width: var(--stenar); box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 10px 6px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
.tabs button { background: none; border: 1px solid var(--line); border-radius: 18px 18px 4px 4px; color: var(--muted); font: inherit; font-size: 10px; font-weight: 500; padding: 14px 0 8px; cursor: pointer; overflow-wrap: normal; letter-spacing: -0.02em; } /* Pixelify Sans är bredare: hela ord på en rad */
.tabs button[aria-selected="true"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); font-weight: 700; }
.tabs { padding-bottom: 52px; }
/* runstenarna (steg 5.3.3.1): stenen i hel skala, i det läge som gäller; namnet bara för skärmläsare och när musen är över */
.tabs button.runsten { border: none; border-radius: 0; background: none; padding: 2px 0; display: grid; place-items: center; }
.tabs button.runsten[aria-selected="true"] { background: none; }
.runsten .sten { display: none; image-rendering: pixelated; }
.runsten .sten.stangd { display: block; }
.runsten[aria-selected="true"] .sten.stangd, .runsten:disabled .sten.stangd { display: none; }
.runsten[aria-selected="true"] .sten.oppen { display: block; }
.runsten:disabled .sten.blek { display: block; }
.runsten:disabled { cursor: default; }
.runsten:not(:disabled):hover .sten { filter: brightness(1.12); }
.runsten .stennamn { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* bandet överst i en flik */
.band { display: flex; justify-content: center; margin: 2px 30px 8px 0; }
.band img { image-rendering: pixelated; display: block; }
#installKnapp { position: fixed; z-index: 3; right: 6px; bottom: 10px; width: calc(var(--stenar) - 12px); height: 34px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 17px; cursor: pointer; padding: 0; }
#installKnapp[aria-expanded="true"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
.muted { color: var(--muted); }
ul, ol { list-style: none; margin: 0; padding: 0; }
.folk li + li { border-top: 1px solid var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; grid-template-areas: "d n a" ". t b"; gap: 1px 8px; align-items: center; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 7px 2px; cursor: pointer; border-radius: 4px; }
.row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row .dot { grid-area: d; }
.row .nm { grid-area: n; font-weight: 700; }
.row .age { grid-area: a; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .act { grid-area: t; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rb { grid-area: b; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.row .bar { width: 64px; }
.row .form { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 2px; } /* förmögenheten (steg 3.10.5) */
.row .ans { line-height: 0; }
.matare { display: flex; flex-direction: column; gap: 3px; } /* humör överst, hälsa under */
.matare > span { display: flex; align-items: center; justify-content: flex-end; }
.bar.halsa > i.p { background: #61767a; } /* skiffer 2 */
.mark { display: inline-block; vertical-align: middle; line-height: 0; } /* ledaren och skadan vid namnet */
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,0.35); }
.dot.big { width: 22px; height: 22px; flex: none; margin-top: 6px; }
/* porträtten ur porträttgeneratorn (steg 5.2.3.2): i punkter, utan utjämning */
.pf { width: 32px; height: 32px; image-rendering: pixelated; flex: none; border-radius: 3px; display: block; }
.pf.big { width: 64px; height: 64px; }
.row .pf { grid-row: 1 / span 2; grid-column: 1; }
.tiphead { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.tiphead h4 { margin: 0; font-family: var(--display); font-size: 16px; font-weight: 400; }
.prick { width: 8px; height: 8px; border-radius: 50%; display: inline-block; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0,0,0,0.35); }
/* mätarna: tio rutor i en mörk ram (steg 5.3.2.4, som personrutan i bildstilen) */
.bar { display: inline-flex; box-sizing: border-box; width: 64px; height: 10px; gap: 1px; padding: 2px; background: #24201d; vertical-align: middle; }
.bar > i { flex: 1; min-width: 1px; background: #372f25; } /* ramen kol 0, tomma rutor kol 2, fyllda ton 2 i sin färg */
.bar > i.p { background: #647025; } /* oliv */
.bar.low > i.p { background: #a14808; } /* rost */
.bar.skill > i.p { background: #b2921b; } /* senap */
.trend { font-size: 9px; margin-left: 3px; vertical-align: middle; line-height: 1; }
.trend.up { color: var(--good); }
.trend.down { color: var(--bad); }
.tag { color: var(--accent); font-weight: 500; font-size: 12px; margin: 0; }
.why { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-style: italic; }
.small { font-size: 12px; margin: 4px 0 0; }
.seder li { padding: 10px 0; border-top: 1px solid var(--line); }
.tekhead { display: flex; justify-content: flex-end; }
.formnamn { text-align: center; font-size: 17px; display: flex; justify-content: center; align-items: center; gap: 6px; margin: 2px 0 6px; }
.rutor { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
.ruta { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.rutnamn { text-align: center; font-weight: 600; margin-bottom: 6px; }
.rutbar { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.rutbar .bar { flex: 1; }
.kv.smal { grid-template-columns: max-content minmax(0, 1fr); gap: 4px 8px; }
.kv dd.helrad { grid-column: 1 / -1; display: block; }
.kv dd.rader { display: block; } .kv dd.rader > div { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; }
.ruta.bred { grid-column: 1 / -1; }
.kv.ensam { grid-template-columns: 1fr; justify-items: center; }
.ruta .kv dd b { white-space: nowrap; }
.hjalp { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 0; }
.hjalp[aria-expanded="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

<div class="app">
  <header>
    <h1>Samhällssimulatorn</h1>
    <div class="cal" aria-live="polite"><b id="calYear">År 1</b><span id="calAge" class="tidsstav">Vårtid</span><span id="calTime"></span><span id="calMotgang" hidden></span><span class="nycklar"><span id="calTemp" class="nyckel"></span><button type="button" id="calRik" class="nyckel calknapp" aria-expanded="false" aria-controls="owned"></button><button type="button" id="calFolk" class="nyckel calknapp"></button></span><span id="sparFel" title="Byn kunde inte sparas i molnet. Den finns kvar i webbläsaren, och spelet försöker igen om en minut." hidden>☁✗</span><span id="molnFel" title="Byn i molnet gick inte att läsa. Den sparas inte där förrän den har lästs, så att den inte skrivs över. Spelet försöker igen, och är byn i molnet nyare tar den över." hidden>☁?</span><span id="lokalFel" title="Byn kunde inte sparas i webbläsaren (lagringen är kanske full eller avstängd). Den sparas i molnet om det går." hidden>⚠</span></div>
  </header>
    <section class="mapwrap" aria-label="Karta över byn">
      <div id="map"></div>
      <div id="ports" class="ports" aria-label="Invånare"></div>
      <div id="portTip" class="tip" hidden></div>
      <div id="hoverBox" class="hoverBox" hidden></div>
      <div id="owned" class="owned" aria-label="Allt byn äger"></div>
      <div class="chips">
        <button type="button" class="chip" id="followChip" hidden></button>
      </div>
      <div id="filters" class="filters" aria-label="Filter på kartan"></div>
      <div id="legend" class="legend" hidden></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zooma in">+</button>
        <button type="button" id="zOut" aria-label="Zooma ut">−</button>
        <button type="button" id="zHome">Byn</button>
      </div>
    </section>
    <aside id="vPanel" class="panel vanster" aria-label="Personen och det valda" hidden><button type="button" class="stang" data-stang="v" aria-label="Stäng">✕</button><div id="vBody" class="panelkropp"></div></aside>
    <aside id="hPanel" class="panel hoger" aria-label="Fliken" hidden><button type="button" class="stang" data-stang="h" aria-label="Stäng">✕</button><div id="panelBody" class="panelkropp"></div></aside>
    <aside id="ruta" class="panel ruta" aria-label="Det man tryckte på" hidden><button type="button" class="stang" data-stang="r" aria-label="Stäng">✕</button><div id="rutaBody" class="panelkropp"></div></aside>
    <nav class="tabs" role="tablist" aria-label="Flikarna"></nav>
    <button type="button" class="stenvert" id="installKnapp" aria-label="Inställningar" title="Testläget och ny by">⚙</button>
    <div class="controls" id="installningar" hidden>
        <label class="switch"><input type="checkbox" id="testToggle"> Testläge</label>
        <div id="speeds" hidden>
          <button type="button" data-v="1">1×</button>
          <button type="button" data-v="60">1 min/s</button>
          <button type="button" data-v="3600">1 tim/s</button>
          <button type="button" data-v="86400">1 år/s</button>
        </div>
        <div id="testSkicka" hidden></div>
        <button type="button" class="ghost" id="arenaKnapp" title="Arenan: prova strider utan att byn påverkas">⚔️</button>
        <button type="button" class="ghost" id="temaKnapp" aria-pressed="false" title="Ljust eller mörkt läge">◐ Mörkt</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="newVillage">Ny by</button>
        <div id="confirmNew" hidden>
          <span>Den nuvarande byn försvinner för gott.</span>
          <button type="button" class="ghost" id="cancelNew">Avbryt</button>
          <button type="button" class="primary" id="okNew">Starta ny by</button>
        </div>
    </div>
</div>
<div id="loading"><div class="card"><h2>Samhällssimulatorn</h2><p class="muted">Letar efter din by…</p></div></div>
<div id="arena" hidden></div>
<div id="overlay" hidden><div class="card"><h2>Välkommen tillbaka</h2><div id="ovBody"></div></div></div>
<script>/*BUNDLE*/</script>
