<title>Lagerplatsprogram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: arbetsyta – artikelkort överst, lagerkarta i mitten, sidopanel till höger, kommandorad under kartan */
:root{
  --bg:#edf0f2; --panel:#fbfcfc; --ink:#17222a; --muted:#5a6873; --line:#d0d8dd;
  --accent:#0e6a87; --accent-soft:#d6e9f0; --accent-ink:#ffffff;
  --mark:#f0b400; --mark-ink:#1d1600;
  --ok:#2d7a4c; --warn:#b4600f; --skip:#727a82; --danger:#b3261e;
  --map-bg:#f7f9fa; --grid:#e1e6ea; --map-edge:#9aa7b0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1a2227; --ink:#e3e9ec; --muted:#93a1ab; --line:#2f3b42;
  --accent:#45a9cc; --accent-soft:#16323d; --accent-ink:#06141a;
  --mark:#f3c02b; --mark-ink:#1d1600;
  --ok:#5bb882; --warn:#e3964f; --skip:#8d969e; --danger:#ef6b62;
  --map-bg:#161d22; --grid:#222c32; --map-edge:#4c5b65; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1a2227; --ink:#e3e9ec; --muted:#93a1ab; --line:#2f3b42;
  --accent:#45a9cc; --accent-soft:#16323d; --accent-ink:#06141a;
  --mark:#f3c02b; --mark-ink:#1d1600;
  --ok:#5bb882; --warn:#e3964f; --skip:#8d969e; --danger:#ef6b62;
  --map-bg:#161d22; --grid:#222c32; --map-edge:#4c5b65; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.45em .8em;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
button.danger{color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4em .55em;min-height:38px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
kbd{font-family:var(--f-mono);font-size:.72em;border:1px solid currentColor;border-radius:3px;padding:0 .3em;opacity:.7;margin-left:.35em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;display:flex;align-items:baseline;gap:.4em}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{border:none;background:none;min-height:36px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.sync{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.busy{background:var(--mark)} .dot.err{background:var(--danger)} .dot.off{background:var(--skip)}

.banner{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.banner.err{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.05em .6em;font-size:.78rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.st-placerad,.st-viacase{color:var(--ok)} .st-aterkom{color:var(--warn)} .st-sorteras_ej{color:var(--skip)} .st-kvar{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Översikt */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--grid);margin-bottom:18px}
.bar i{display:block;height:100%}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:22px}
.mode{text-align:left;padding:12px 14px;border-radius:10px;min-height:76px;display:flex;flex-direction:column;gap:2px}
.mode strong{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.primary span{color:inherit;opacity:.85}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.minibar{display:flex;height:6px;width:100px;border-radius:3px;overflow:hidden;background:var(--grid)}
.minibar i{display:block;height:100%}

/* Inmatning */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;margin:0 auto 12px;max-width:900px}
.card .name{font-family:var(--f-display);font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:600;line-height:1.15;text-wrap:balance}
.card .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.88rem;color:var(--muted);margin-top:4px}
.card .forval{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.counters{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:.82rem;color:var(--muted);margin-top:8px}
.counters b{color:var(--ink);font-variant-numeric:tabular-nums}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.cmds{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cmds button{flex:1 1 auto}
.heights{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.heights button{min-width:42px;padding:.3em .5em;font-family:var(--f-mono)}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.places li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px}
.places li.via{border-style:dashed}
.pin{width:24px;height:24px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:.75rem;font-weight:700;font-family:var(--f-mono)}
.pin.c{background:none;border:2px solid var(--accent);color:var(--accent)}
.places .ctl{display:flex;gap:4px;align-items:center}
.places select,.places input{min-height:32px;padding:.15em .3em;font-size:.85rem}
.places input{width:58px}
.places button{min-height:32px;padding:.1em .5em}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.flow ol{margin:0;padding-left:1.2em;font-size:.85rem}
.flow li{margin-bottom:3px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}

/* Karta */
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--map-bg);width:100%;aspect-ratio:var(--map-ar,1.45);max-height:max(300px,calc(100dvh - 300px));min-height:300px;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox svg{width:100%;height:100%;display:block;touch-action:none}
.maptools{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.maptools button{min-height:34px;padding:.2em .6em;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.hbadge{position:absolute;left:8px;top:8px;z-index:2;background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.95rem;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{display:block}
.tip ul{margin:4px 0 0;padding-left:1.1em}
svg .edge{fill:none;stroke:var(--map-edge);stroke-width:1.5;vector-effect:non-scaling-stroke}
svg .gridl{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
svg .obj{stroke-width:1.5;vector-effect:non-scaling-stroke;fill-opacity:.32}
svg .obj.zon{fill-opacity:.14;stroke-dasharray:6 4}
svg .obj.sel{stroke-width:3;fill-opacity:.5}
svg .olabel.zl{text-anchor:start;fill:var(--muted);text-transform:uppercase;letter-spacing:.04em}
svg .olabel{fill:var(--ink);font-family:var(--f-body);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .empty{fill:var(--muted);font-family:var(--f-body);text-anchor:middle}
svg .mk{fill:var(--mark);stroke:var(--mark-ink);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
svg .mkz{fill:var(--mark);fill-opacity:.28;stroke:var(--mark);stroke-width:2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;cursor:pointer}
svg .mkc{fill:var(--panel);stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
svg .mkt{fill:var(--mark-ink);font-family:var(--f-mono);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .mkct{fill:var(--accent);font-family:var(--f-mono);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .draft{fill:var(--accent);fill-opacity:.15;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 3;vector-effect:non-scaling-stroke}
svg .handle{fill:var(--panel);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;cursor:nwse-resize}
svg .other{fill:var(--muted);fill-opacity:.45}

.edit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:900px){.edit{grid-template-columns:minmax(0,1fr)}}
.toolrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.toolrow button{min-height:36px}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:.9rem}
.form input,.form select{width:100%}
.objlist{max-height:260px;overflow:auto;font-size:.85rem}
.objlist button{display:flex;width:100%;justify-content:space-between;border:none;border-bottom:1px solid var(--line);border-radius:0;min-height:34px;text-align:left;background:none}
.results{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.results li button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:8px 4px}
.results small{color:var(--muted);display:block}
.sec{margin-bottom:22px}
.sec h2{margin-bottom:8px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
pre.log{font-family:var(--f-mono);font-size:.78rem;white-space:pre-wrap;margin:0;max-height:220px;overflow:auto}
.done{text-align:center;padding:40px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">Lagerplatser <small>Ljus &amp; Nöje</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sync" id="sync"><span class="dot off"></span><span>Ansluter…</span></div>
</header>
<div id="banners"></div>
<main id="main"><p class="muted">Läser in…</p></main>

<script>
"use strict";
/* ---------- Konstanter och hjälpfunktioner ---------- */
const NSH_ART = 12, NSH_GG = 8, MAPW = 1000;
const TYPER = {
  hylla:   {p:"H", namn:"Hylla",   farg:"#5b8db3"},
  skap:    {p:"S", namn:"Skåp",    farg:"#8b70b8"},
  golvyta: {p:"G", namn:"Golvyta", farg:"#98a3ab"},
  pall:    {p:"P", namn:"Pall",    farg:"#b88a4a"},
  zon:     {p:"Z", namn:"Zon",     farg:"#4f9e78"},
  dorr:    {p:"D", namn:"Dörr/port", farg:"#669c35", ejPlats:true},
};
const STATUSNAMN = {placerad:"Placerad", aterkom:"Återkom", sorteras_ej:"Sorteras ej", viacase:"Via case", kvar:"Kvar"};
const MODNAMN = {fortsatt:"Fortsätt", aterkom:"Återkom", kategori:"Kategori", sok:"Sök artikel"};
const coll = new Intl.Collator("sv", {numeric:true, sensitivity:"base"});
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const nu = () => new Date().toISOString();
const r1 = v => Math.round(v * 10) / 10;
function hash(s){ let h = 5381; for (const c of String(s)) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h; }
const shardArt = id => hash(id) % NSH_ART, shardGG = id => hash(id) % NSH_GG;
const keyOf = (id, ser) => ser == null ? id : id + "|" + ser;
function splitKey(k){ const i = k.indexOf("|"); return i < 0 ? [k, null] : [k.slice(0, i), k.slice(i + 1)]; }

/* ---------- Tillstånd ---------- */
const S = {
  db:null, dbState:"laddar", loaded:{art:false}, art:{}, gg:{}, obj:{}, prio:[], prioMeta:{}, meta:{}, karta:{hojd:700, raknare:{}},
  view:"oversikt", mode:null, kategori:null, sokId:null,
  cur:null, sel:[], osaker:false, text:"", hojd:null, forvalNote:"",
  nav:[], navPos:null, handled:new Set(), forra:null,
  sokFras:"", hplats:null, hAntal:"", hSok:"",
  edit:{tool:"valj", selId:null, draft:null, confirmDel:false},
  vb:null, panMode:false, riggPrev:null, riggRes:null, riggRak:true, saving:0, fel:null, importPrev:null, importRes:null, confirmWipe:false,
};

/* ---------- Skrivning med kö per dokument ---------- */
const chains = {};
function write(path, fn){
  if (!S.db) return Promise.resolve();
  S.saving++; renderSync();
  chains[path] = (chains[path] || Promise.resolve()).then(fn).catch(async e => {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random()*600)); return fn(); }
    throw e;
  }).catch(e => { S.fel = (e && e.message) || String(e); console.error(e); })
    .finally(() => { S.saving--; renderSync(); });
  return chains[path];
}
function putGG(id, d){ S.gg[id] = d; invalidate(); write("genomgang/" + id, () => S.db.doc("genomgang/" + id).set(d)); }
function writeRec(k, r){
  const [id, ser] = splitKey(k);
  const d = clone(S.gg[id]) || {};
  d.id = id; d.shard = shardGG(id);
  if (ser == null) Object.assign(d, r);
  else { d.enheter = d.enheter || {}; d.enheter[ser] = r; }
  d.andrad = nu();
  putGG(id, d);
}
const LOGG = {id:"L" + Date.now().toString(36), start:nu(), entries:[]};
function logg(a, k, d){
  if (!S.db) return;
  LOGG.entries.push({t:nu(), a, k:k || null, d:d || null});
  if (LOGG.entries.length > 300){ LOGG.id = "L" + Date.now().toString(36); LOGG.start = nu(); LOGG.entries = LOGG.entries.slice(-1); }
  const id = LOGG.id, data = {start:LOGG.start, entries:LOGG.entries.slice()};
  write("logg/" + id, () => S.db.doc("logg/" + id).set(data));
}

/* ---------- Härledd data ---------- */
let memo = null;
function invalidate(){ memo = null; schedule(); }
function isActive(id){ const a = S.art[id]; return !!a && a.aktiv !== false && !a.borttagen; }
function byMGN(a, b){ const A = S.art[a], B = S.art[b];
  return coll.compare(A.mapp || "", B.mapp || "") || coll.compare(A.grupp || "", B.grupp || "") || coll.compare(A.namn || "", B.namn || "") || coll.compare(a, b); }
function M(){
  if (memo) return memo;
  const act = Object.keys(S.art).filter(isActive);
  const cases = act.filter(id => S.art[id].arCase).sort(byMGN);
  const used = new Set(cases);
  const prio = [];
  for (const id of S.prio) if (isActive(id) && !used.has(id)) { used.add(id); prio.push(id); }
  const rest = act.filter(id => !used.has(id)).sort(byMGN);
  const order = cases.concat(prio, rest);
  const caseIdx = {};
  for (const c of cases) for (const it of (S.art[c].innehall || [])) (caseIdx[it.id] = caseIdx[it.id] || []).push({caseId:c, antal:it.antal});
  memo = {act, order, caseIdx, objIdx:null, mappar:null};
  return memo;
}
function rec(k){ const [id, ser] = splitKey(k); const g = S.gg[id]; if (!g) return null;
  if (ser == null) return g.status ? g : null; return (g.enheter && g.enheter[ser]) || null; }
function processed(k){ const r = rec(k); return !!(r && r.status); }
function units(id){ return ((S.art[id] && S.art[id].serienr) || []).slice().sort(coll.compare); }
function isSplit(id){ return !!(S.gg[id] && S.gg[id].uppdelad) && units(id).length > 0; }
function expand(id){ return isSplit(id) ? units(id).map(s => keyOf(id, s)) : [id]; }
function casePlaces(caseId){ const g = S.gg[caseId]; return (g && g.status === "placerad" && g.platser) || []; }
function viaCase(id){
  return (M().caseIdx[id] || []).map(e => ({...e, platser:casePlaces(e.caseId)})).filter(e => e.platser.length);
}
function artStatus(id){
  if (isSplit(id)){
    const us = units(id).map(s => rec(keyOf(id, s)));
    if (us.some(r => r && (r.status === "aterkom" || r.osaker))) return "aterkom";
    if (us.every(r => r && r.status)) return us.some(r => r.status === "placerad") ? "placerad" : "sorteras_ej";
    return "kvar";
  }
  const r = rec(id);
  if (r){ if (r.status === "aterkom" || r.osaker) return "aterkom"; return r.status; }
  return viaCase(id).length ? "viacase" : "kvar";
}
function allPlaces(){ // [{key, p}] egna platser för alla nycklar
  const out = [];
  for (const id in S.gg){ const g = S.gg[id]; if (!isActive(id)) continue;
    if (g.status && !isSplit(id)) for (const p of (g.platser || [])) out.push({key:id, p});
    if (isSplit(id) && g.enheter) for (const s in g.enheter){ const r = g.enheter[s]; if (r.status) for (const p of (r.platser || [])) out.push({key:keyOf(id, s), p}); }
  }
  return out;
}
function objIdx(){
  const m = M(); if (m.objIdx) return m.objIdx;
  const idx = {};
  for (const {key, p} of allPlaces()) if (p.objektId) (idx[p.objektId] = idx[p.objektId] || new Set()).add(key);
  m.objIdx = idx; return idx;
}
function keyName(k){ const [id, ser] = splitKey(k); const a = S.art[id]; return (a ? a.namn : id) + (ser != null ? " · SN " + ser : ""); }

/* ---------- Köer ---------- */
function queue(limit, mode = S.mode){
  const m = M(), keys = [], H = S.handled;
  const push = k => { keys.push(k); return limit && keys.length >= limit; };
  if (mode === "fortsatt"){
    outer: for (const id of m.order) for (const k of expand(id)) if (!processed(k) && !H.has(k) && push(k)) break outer;
  } else if (mode === "aterkom"){
    outer2: for (const id of m.order) for (const k of expand(id)){ const r = rec(k); if (r && (r.status === "aterkom" || r.osaker) && !H.has(k) && push(k)) break outer2; }
  } else if (mode === "kategori"){
    const a = [], b = [];
    for (const id of m.act.filter(id => (S.art[id].mapp || "(utan mapp)") === S.kategori).sort(byMGN))
      for (const k of expand(id)) if (!H.has(k)) (processed(k) ? b : a).push(k);
    return limit ? a.concat(b).slice(0, limit) : a.concat(b);
  } else if (mode === "sok" && S.sokId){
    for (const k of expand(S.sokId)) if (!H.has(k)) keys.push(k);

function cmdOsaker(){ if (!S.cur) return; S.osaker = !S.osaker; render(); }

}
function renderMarks(){
  let h = "";
  if (S.view === "inmatning" && S.cur){
    const [id] = splitKey(S.cur);
    for (const v of viaCase(id)) for (const p of v.platser) h += mkPlace(p, "C", null, true);
    // Platser på samma ställe (olika hyllplan) ritas bredvid varandra så att alla syns och går att trycka på; de sparas med samma koordinat.
    const R = S.vb ? S.vb.w / 70 : 14, seen = [];
    S.sel.forEach((p, i) => {
      const c = p.typ === "zon" && p.polygon ? centroid(p.polygon) : p;
      const k = seen.filter(q => Math.hypot(q.x - c.x, q.y - c.y) < R * 0.8).length; seen.push({x:c.x, y:c.y});
      if (!k){ h += mkPlace(p, String(i + 1), i, false); return; }
      const [dx, dy] = unrotV([k * R * 2.3, 0]);
      h += mkPoint({x:c.x + dx, y:c.y + dy, hojd:p.hojd}, "mk", "mkt", String(i + 1), i);
    });
  }
  if (S.view === "hylla" && S.hplats) h += mkPlace(S.hplats, "•", null, false);
  $("#g-mk", svg).innerHTML = h;
  hbadge.hidden = S.hojd == null || S.view === "karta";

/* ---------- Kartredigering ---------- */
const snap = v => Math.round(v / 5) * 5;
function newObjId(typ){
  const p = TYPER[typ].p, rk = {...(S.karta.raknare || {})};
  let n = rk[p] || 0;
  for (const id in S.obj) if (id.startsWith(p)){ const m = +id.slice(p.length); if (m > n) n = m; }
  n++; rk[p] = n; S.karta = {...S.karta, raknare:rk}; saveKarta();
  return p + n;
}
function saveKarta(){ const d = {hojd:mapH(), raknare:S.karta.raknare || {}, rigg:S.karta.rigg || null, flytt:S.karta.flytt || {}}; write("config/karta", () => S.db.doc("config/karta").set(d)); }
function saveObj(o){ S.obj[o.id] = o; invalidate(); const d = clone(o); write("kartobjekt/" + o.id, () => S.db.doc("kartobjekt/" + o.id).set(d)); }
function editorDown(e, p){
  const ed = S.edit, t = e.target;
  if (ed.tool === "valj"){
    const hd = t.closest && t.closest("[data-h]");
    if (hd && ed.selId){ gest.edit = {kind:"handle", h:hd.dataset.h, orig:clone(S.obj[ed.selId])}; return; }
    const o = objectAt(p, true);
    if (o){ ed.selId = o.id; ed.confirmDel = false; gest.edit = {kind:"move", orig:clone(o)}; render(); }
    else { gest.type = "pan"; ed.selId = null; ed.confirmDel = false; render(); }
  } else if (ed.tool !== "poly"){ gest.edit = {kind:"draw"}; }
}
function editorMove(p){
  const ed = S.edit, ge = gest && gest.edit; if (!ge) return;
  const dx = p.x - gest.p0.x, dy = p.y - gest.p0.y;
  if (ge.kind === "move"){
    const o = clone(ge.orig);
    if (o.form === "poly") o.punkter = o.punkter.map(([x, y]) => [snap(x + dx), snap(y + dy)]);
    else { o.x = snap(o.x + dx); o.y = snap(o.y + dy); }
    S.obj[o.id] = o; renderObjs(); renderDraft();
  } else if (ge.kind === "handle"){
    const o = clone(ge.orig);
    if (o.form === "poly"){ const i = +ge.h; o.punkter[i] = [snap(p.x), snap(p.y)]; }
    else {
      let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
      if (ge.h.includes("w")) x1 = snap(p.x); if (ge.h.includes("e")) x2 = snap(p.x);
      if (ge.h.includes("n")) y1 = snap(p.y); if (ge.h.includes("s")) y2 = snap(p.y);
      o.x = Math.min(x1, x2); o.y = Math.min(y1, y2); o.w = Math.max(5, Math.abs(x2 - x1)); o.h = Math.max(5, Math.abs(y2 - y1));
    }
    S.obj[o.id] = o; renderObjs(); renderDraft();
  } else if (ge.kind === "draw"){
    ed.draft = {x1:snap(gest.p0.x), y1:snap(gest.p0.y), x2:snap(p.x), y2:snap(p.y)}; renderDraft();
  }
}
function editorUp(p, g){
  const ed = S.edit, ge = g.edit;
  if (ed.tool === "poly"){
    if (g.moved) return;
    const d = ed.draft && ed.draft.poly ? ed.draft : {poly:[]};
    d.poly.push([snap(p.x), snap(p.y)]); ed.draft = d; renderDraft(); renderEditPanel(); return;
  }
  if (!ge) return;
  if (ge.kind === "move" || ge.kind === "handle"){
    if (!g.moved) return;
    const o = S.obj[ed.selId]; saveObj(o);
    if (ge.kind === "move" && o.riggId != null && S.karta.rigg){ // flytt av ett objekt från Riggplaneraren sparas i meter och gäller även vid nästa inläsning
      const a = objPts(ge.orig)[0], b = objPts(o)[0], k = S.karta.rigg.skala, f = {...(S.karta.flytt || {})}, old = f[o.riggId] || [0, 0];
      f[o.riggId] = [Math.round((old[0] + (b[0] - a[0]) / k) * 100) / 100, Math.round((old[1] + (b[1] - a[1]) / k) * 100) / 100];
      S.karta = {...S.karta, flytt:f}; saveKarta();
    }
    return;
  }
  if (ge.kind === "draw"){
    let x1, y1, x2, y2;
    if (g.moved && ed.draft){ ({x1, y1, x2, y2} = ed.draft); }
    else { const def = ed.tool === "pall" ? [40, 40] : ed.tool === "hylla" ? [80, 25] : [80, 60]; x1 = snap(p.x - def[0] / 2); y1 = snap(p.y - def[1] / 2); x2 = x1 + def[0]; y2 = y1 + def[1]; }
    ed.draft = null;
    if (Math.abs(x2 - x1) < 5 || Math.abs(y2 - y1) < 5){ renderDraft(); return; }
    const typ = ed.tool, id = newObjId(typ);
    const o = {id, typ, namn:"", farg:TYPER[typ].farg, form:"rect", x:Math.min(x1, x2), y:Math.min(y1, y2), w:Math.abs(x2 - x1), h:Math.abs(y2 - y1), skapad:nu()};
    saveObj(o); logg("nytt_objekt", null, {id});
    ed.selId = id; ed.tool = "valj"; render();
  }
}
function finishPoly(){
  const ed = S.edit; if (!ed.draft || !ed.draft.poly || ed.draft.poly.length < 3) return;
  const id = newObjId("zon");
  saveObj({id, typ:"zon", namn:"", farg:TYPER.zon.farg, form:"poly", punkter:ed.draft.poly, skapad:nu()});
  logg("nytt_objekt", null, {id});
  ed.draft = null; ed.selId = id; ed.tool = "valj"; render();
}
function renderDraft(){
  const g = $("#g-draft", svg), ed = S.edit; let h = "";
  if (S.view === "karta"){
    if (ed.draft && ed.draft.poly){ const pts = ed.draft.poly; h += `<polyline class="draft" points="${pts.map(p => p.join(",")).join(" ")}"/>`; for (const [x, y] of pts) h += `<circle class="handle" cx="${x}" cy="${y}" r="${S.vb.w / 160}"/>`; }
    else if (ed.draft){ const d = ed.draft; h += `<rect class="draft" x="${Math.min(d.x1, d.x2)}" y="${Math.min(d.y1, d.y2)}" width="${Math.abs(d.x2 - d.x1)}" height="${Math.abs(d.y2 - d.y1)}"/>`; }
    const o = ed.selId && S.obj[ed.selId];
    if (o){
      const r = S.vb.w / 120;
      if (o.form === "poly") o.punkter.forEach(([x, y], i) => { h += `<circle class="handle" data-h="${i}" cx="${x}" cy="${y}" r="${r}"/>`; });
      else for (const [k, x, y] of [["nw", o.x, o.y], ["ne", o.x + o.w, o.y], ["sw", o.x, o.y + o.h], ["se", o.x + o.w, o.y + o.h]]) h += `<rect class="handle" data-h="${k}" x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}"/>`;
    }
  }
  g.innerHTML = h;
}
function placeCount(oid){ return allPlaces().filter(x => x.p.objektId === oid).length; }

/* ---------- Vy: Sök ---------- */
function search(q, max){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return [];
  const out = [];
  for (const id of M().order){ const a = S.art[id]; const hay = (id + " " + a.namn + " " + (a.mapp || "") + " " + (a.grupp || "") + " " + (a.serienr || []).join(" ")).toLowerCase();
    if (terms.every(t => hay.includes(t))){ out.push(id); if (out.length >= max) break; } }
  return out;
}

/* ---------- Inläsning från Riggplaneraren ---------- */
// Riggplaneraren ritar i meter med y nedåt; zon = polygon (pts), byggnad/tält = mittpunkt x,y, bredd w, djup h, vridning rot.
const RIGGTYP = {zone:"zon", building:"hylla", tent:"skap"};
function riggCorners(it){ const a = it.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([u, v]) => { const lx = u * it.w / 2, ly = v * it.h / 2; return [it.x + lx * c - ly * s, it.y + lx * s + ly * c]; }); }
function straightenZones(items){
  // Kanter som lutar högst 10° från vågrätt eller lodrätt görs helt raka. Hörn som är exakt samma punkt i Riggplaneraren
  // (gemensamma väggar) flyttas tillsammans, och raka linjer som hamnar inom 25 cm från varandra läggs på samma linje.
  const nodes = new Map(), node = p => { const k = p[0].toFixed(3) + "," + p[1].toFixed(3); if (!nodes.has(k)) nodes.set(k, {p:[p[0], p[1]], par:[null, null]}); return nodes.get(k); };
  const polys = items.filter(it => it.pts).map(it => ({it, ns:it.pts.map(node)}));
  const find = (n, ax) => { while (n.par[ax]) n = n.par[ax]; return n; };
  const union = (a, b, ax) => { a = find(a, ax); b = find(b, ax); if (a !== b) b.par[ax] = a; };
  const tan8 = Math.tan(10 * Math.PI / 180);
  for (const {ns} of polys) ns.forEach((a, i) => { const b = ns[(i + 1) % ns.length], dx = Math.abs(a.p[0] - b.p[0]), dy = Math.abs(a.p[1] - b.p[1]);
    if (dy <= dx * tan8) union(a, b, 1); else if (dx <= dy * tan8) union(a, b, 0); });
  for (const ax of [0, 1]){
    const groups = new Map();
    for (const n of nodes.values()){ const r = find(n, ax); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(n); }
    const lines = [...groups.values()].map(ns => ({ns, v:ns.reduce((t, n) => t + n.p[ax], 0) / ns.length})).sort((a, b) => a.v - b.v);
    for (let i = 0; i < lines.length;){
      let j = i + 1; while (j < lines.length && lines[j].v - lines[i].v <= 0.25) j++;
      const all = lines.slice(i, j).flatMap(l => l.ns), v = Math.round(all.reduce((t, n) => t + n.p[ax], 0) / all.length * 100) / 100;
      for (const l of lines.slice(i, j)) if (j - i > 1 || l.ns.length > 1) for (const n of l.ns) n.p[ax] = v;
      i = j;
    }
  }
  for (const {it, ns} of polys) it.pts = ns.map(n => [n.p[0], n.p[1]]).filter((p, i, a) => { const q = a[(i + 1) % a.length]; return p[0] !== q[0] || p[1] !== q[1]; });
}
function riggParse(text, fil, straighten){
  let d; try { d = JSON.parse(text); } catch (e){ throw new Error("Filen är inte en sparfil från Riggplaneraren"); }
  const st = d && d.app === "Riggplaneraren" ? d.state : d, objs = st && st.area && st.area.objs;
  if (!Array.isArray(objs)) throw new Error("Filen innehåller inget område från Riggplaneraren");
  const items = [], ign = {};
  for (const o of objs){
    const typ = RIGGTYP[o.type];
    if (!typ){ ign[o.type] = (ign[o.type] || 0) + 1; continue; }
    if (o.type === "zone"){ if (Array.isArray(o.pts) && o.pts.length >= 3) items.push({riggId:o.id, typ, namn:(o.text || "").trim(), pts:o.pts.map(p => [+p[0], +p[1]])}); continue; }
    let rot = (((+o.rot || 0) % 360) + 360) % 360;
    const t2 = o.type !== "building" ? typ : /\b(dörr|port|lastport|ingång|entré)/i.test(o.text || "") ? "dorr" : /skåp/i.test(o.text || "") ? "skap" : typ;
    const farg = o.color && !/^#c9ced4$/i.test(o.color) ? o.color : null;
    if (straighten){ const r = Math.round(rot / 90) * 90; if (Math.abs(rot - r) <= 6) rot = r % 360; }
    items.push({riggId:o.id, typ:t2, namn:(o.text || "").trim(), farg, x:+o.x, y:+o.y, w:+o.w || 1, h:+o.h || 1, rot});
  }
  const F = S.karta.flytt || {}; let flyttade = 0;
  for (const it of items){ const f = F[it.riggId]; if (!f) continue; flyttade++;
    if (it.pts) it.pts = it.pts.map(([x, y]) => [x + f[0], y + f[1]]); else { it.x += f[0]; it.y += f[1]; } }
  if (straighten) straightenZones(items);
  // Skala och nollpunkt bestäms vid första inläsningen och ligger sedan fast, så sparade klick inte flyttar sig.
  // Så länge inget är placerat räknas skala och nollpunkt om, så kartan alltid täcker ritningen tätt.
  let T = allPlaces().length ? S.karta.rigg : null, ny = false;
  const all = []; for (const it of items) for (const p of (it.pts || riggCorners(it))) all.push(p);
  if (!all.length) throw new Error("Filen innehåller inga zoner, byggnader eller tält");
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  if (!T){ const x0 = Math.min(...xs) - 2, y0 = Math.min(...ys) - 2, span = Math.max(...xs) - x0 + 2;
    T = {skala:Math.max(1, Math.min(40, Math.floor(MAPW / span))), x0:Math.round(x0 * 100) / 100, y0:Math.round(y0 * 100) / 100}; ny = true; }
  const hojd = Math.max(ny ? 100 : mapH(), Math.ceil(((Math.max(...ys) - T.y0) + 2) * T.skala / 10) * 10);
  const utanfor = Math.max(...xs) > T.x0 + MAPW / T.skala || Math.min(...xs) < T.x0 || Math.min(...ys) < T.y0;
  const byRigg = {}; for (const o of Object.values(S.obj)) if (o.riggId != null) byRigg[o.riggId] = o;
  const inFile = new Set(items.map(it => it.riggId));
  const saknas = Object.values(byRigg).filter(o => !inFile.has(o.riggId));
  return {fil, items, ign, T, ny, hojd, utanfor, straighten, flyttade,
    nya:items.filter(it => !byRigg[it.riggId]).length, upd:items.filter(it => byRigg[it.riggId]).length, saknas,
    bredd:Math.round(Math.max(...xs) - Math.min(...xs)), djup:Math.round(Math.max(...ys) - Math.min(...ys))};
}
function riggGeo(it, T){
  const P = ([mx, my]) => [r1((mx - T.x0) * T.skala), r1((my - T.y0) * T.skala)];
  let pts = it.pts ? it.pts.map(P) : null;

      return {form:"rect", x:r1(cx - w * T.skala / 2), y:r1(cy - h * T.skala / 2), w:r1(w * T.skala), h:r1(h * T.skala)}; }
    pts = riggCorners(it).map(P);
  }
  if (pts.length === 4 && pts.every((p, i) => { const q = pts[(i + 1) % 4]; return p[0] === q[0] || p[1] === q[1]; })){
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x = Math.min(...xs), y = Math.min(...ys);
    return {form:"rect", x, y, w:r1(Math.max(...xs) - x), h:r1(Math.max(...ys) - y)};
  }
  return {form:"poly", punkter:pts};
}
function riggApply(){
  const R = S.riggPrev; if (!R) return;
  const byRigg = {}; for (const o of Object.values(S.obj)) if (o.riggId != null) byRigg[o.riggId] = o;
  S.karta = {...S.karta, hojd:R.hojd, rigg:{...R.T, fil:R.fil, importerad:nu()}};

// Ett citattecken avslutar därför fältet bara när avgränsare eller radslut följer; "" före avgränsaren är ett tum-tecken plus fältets slut.
function parseCSV(text){
  text = text.replace(/^\ufeff/, "");
  const first = text.slice(0, text.indexOf("\n") + 1 || text.length);
  const cnt = c => first.split(c).length;
  const d = [";", ",", "\t"].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], f = "", i = 0, q = false;
  const end = c => c === d || c === "\n" || c === "\r" || c === undefined;
  while (i < text.length){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i + 1] === '"' && end(text[i + 2])){ f += '"'; q = false; i += 2; continue; }
        if (text[i + 1] === '"'){ f += '"'; i += 2; continue; }
        if (end(text[i + 1])){ q = false; i++; continue; }
        f += c; i++; continue; // citattecken mitt i texten
      }
      f += c; i++; continue;
    }
    if (c === '"' && f === ""){ q = true; i++; continue; }
    if (c === d){ row.push(f); f = ""; i++; continue; }
    if (c === "\r"){ i++; continue; }
    if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; i++; continue; }
    f += c; i++;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ""));
}
async function readSheets(files){
  const out = [];
  for (const f of files){
    if (/\.(csv|txt|tsv)$/i.test(f.name)){ out.push({fil:f.name, blad:"", rows:parseCSV(await f.text())}); continue; }
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    for (const n of wb.SheetNames) out.push({fil:f.name, blad:n, rows:XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:"", raw:false, blankrows:false})});
  }
  return out;
}

function detectCols(rows){

function parseImport(sheets, opt){
  const A = new Map(), log = [];
  const get = id => { if (!A.has(id)) A.set(id, {id, namn:"", mapp:"", grupp:"", typ:"", arkiverad:false, arCase:false, serienr:new Set(), innehall:new Map()}); return A.get(id); };
  for (const sh of sheets){
    const d = detectCols(sh.rows);
    if (!d){ log.push(`${sh.fil} / ${sh.blad}: ingen kolumn för artikel-ID, hoppas över`); continue; }
    const {hdr, cols} = d, cell = (row, k) => cols[k] == null ? "" : String(row[cols[k]] ?? "").trim();
    let n = 0;
    for (const row of sh.rows.slice(hdr + 1)){
      const id = normId(cell(row, "id")); if (!id) continue;
      if (cols.caseId != null){
        const c = normId(cell(row, "caseId")); if (!c) continue;
        const ca = get(c); ca.arCase = true; ca.innehall.set(id, (ca.innehall.get(id) || 0) + (parseInt(cell(row, "antal")) || 1)); n++; continue;
      }
      const a = get(id);
      for (const k of ["namn", "mapp", "grupp", "typ"]){ const v = cell(row, k); if (v && !a[k]) a[k] = v; }
      if (cols.arkiverad != null && yes(cell(row, "arkiverad"))) a.arkiverad = true;
      if (cols.arCase != null && yes(cell(row, "arCase"))) a.arCase = true;
      if (cols.serAktiv == null || cell(row, "serAktiv") !== "0") for (const s of cell(row, "serienr").split(/[,;\n]+/)) if (s.trim()) a.serienr.add(s.trim());
      for (const part of cell(row, "innehall").split(/[,;\n]+/)){
        const m = part.trim().match(/^([^\s:x×*]+)\s*(?:[x×:*]\s*(\d+))?$/i); // "kod", "kod x 2" eller "kod:2"
        if (m){ a.innehall.set(normId(m[1]), +(m[2] || 1)); a.arCase = true; }
      }
      n++;

    log.push(`${sh.fil}${sh.blad ? " / " + sh.blad : ""}: ${n} rader`);
  }

  for (const a of A.values()){
    const t = a.typ.toLowerCase();
    if (!opt.virtuella && /virtual|virtuell/.test(t)){ skipped.virtuella++; continue; }
    if (!a.namn && !S.art[a.id]){ skipped.utanNamn++; continue; }
    if (/^case$|physical combination|fysisk kombination/.test(t) || a.innehall.size) a.arCase = true;
    items.push(a);
  }
  return {items, log, skipped};
}
function diffImport(P, wipe){

  for (const a of P.items){
    const o = wipe ? null : S.art[a.id];
    if (a.arCase) sum.case++; if (a.arkiverad) sum.arkiverade++;
    if (!o) sum.nya++;
    else {
      if ((a.namn && a.namn !== o.namn) || (a.mapp && a.mapp !== o.mapp) || (a.grupp && a.grupp !== o.grupp) || (o.aktiv !== false) === a.arkiverad || o.borttagen) sum.andrade++;

    }

}

    else if (a === "riggok") riggApply();
    else if (a === "riggno"){ S.riggPrev = null; renderRiggPanel(); }
    else if (a === "polycancel"){ S.edit.draft = null; S.edit.tool = "valj"; render(); }
    else if (a === "odel"){ S.edit.confirmDel = true; render(); }
    else if (a === "odelno"){ S.edit.confirmDel = false; render(); }
    else if (a === "odel2"){ const id = S.edit.selId; delete S.obj[id]; S.edit.selId = null; S.edit.confirmDel = false; invalidate(); write("kartobjekt/" + id, () => S.db.doc("kartobjekt/" + id).delete()); logg("ta_bort_objekt", null, {id}); }
    else if (a === "impgo") applyImport();
    else if (a === "impcancel"){ S.importPrev = null; render(); }
    else if (a === "wipe"){ S.confirmWipe = true; render(); }
    else if (a === "wipeno"){ S.confirmWipe = false; render(); }
    else if (a === "wipe2"){ S.confirmWipe = false; const ids = Object.keys(S.gg); S.gg = {}; for (const id of ids) write("genomgang/" + id, () => S.db.doc("genomgang/" + id).delete()); logg("radera_inmatning", null, {antal:ids.length}); S.handled = new Set(); S.nav = []; S.navPos = null; invalidate(); }
  }
  if (t.tagName === "BUTTON") t.blur();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ph != null){ const p = S.sel[+t.dataset.ph]; if (p){ p.hojd = t.value === "" ? null : +t.value; renderMarks(); } }
  if (t.dataset.pa != null){ const p = S.sel[+t.dataset.pa]; if (p) p.antal = t.value ? +t.value : null; }
});
document.addEventListener("keydown", e => {
  const t = e.target, tag = t.tagName;
  if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && !["checkbox", "radio", "button"].includes(t.type)) || t.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = S.view;
  if (v === "karta"){
    if (e.key === "Escape"){ S.edit.draft = null; if (S.edit.tool === "poly") S.edit.tool = "valj"; render(); }
    else if (e.key === "Enter" && S.edit.tool === "poly"){ e.preventDefault(); finishPoly(); }
    return;
  }
  if (v !== "inmatning" && v !== "hylla") return;
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); cmdHojd(+e.key); return; }
  if (v !== "inmatning") return;
  const map = {Enter:() => cmdSpara(), " ":cmdSamma, Backspace:() => cmdSpara("sorteras_ej"), Escape:cmdAngra, ArrowLeft:cmdBak, ArrowRight:cmdFram};
  if (map[e.key]){ e.preventDefault(); map[e.key](); }
});
window.addEventListener("resize", () => { if (S.vb) applyVB(); });

/* ---------- Databasen ---------- */
(async () => {
  render();
  let db = null;
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e){ db = null; }
  if (!db){ S.dbState = "saknas"; S.loaded.art = true; render(); return; }
  S.db = db; S.dbState = "ok";
  const onErr = e => { S.fel = "Kontakten med databasen bröts (" + (e && e.code) + "). Ladda om sidan."; render(); };
  db.collection("artiklar").onSnapshot(s => {
    const art = {}; for (const d of s.docs){ const it = (d.data() || {}).items || {}; for (const id in it) art[id] = it[id]; }
    S.art = art; S.loaded.art = true; invalidate();
  }, onErr);
  for (let k = 0; k < NSH_GG; k++){
    db.collection("genomgang").where("shard", "==", k).limit(1000).onSnapshot(s => {
      for (const ch of s.docChanges()){ if (ch.type === "removed") delete S.gg[ch.doc.id]; else S.gg[ch.doc.id] = ch.doc.data(); }
      invalidate();
    }, onErr);
  }
  db.collection("kartobjekt").limit(1000).onSnapshot(s => {
    const drag = gest && gest.edit && S.edit.selId;
    const o = {}; for (const d of s.docs) o[d.id] = d.data();
    if (drag && S.obj[S.edit.selId]) o[S.edit.selId] = S.obj[S.edit.selId];
    S.obj = o; invalidate();
    if (!S.objLoaded && s.docs.length){ S.objLoaded = true; fit(); }
  }, onErr);
  db.doc("config/meta").onSnapshot(d => { S.meta = (d.exists && d.data()) || {}; invalidate(); }, onErr);
  db.doc("config/prioritet").onSnapshot(d => { const v = (d.exists && d.data()) || {}; S.prio = v.ids || []; S.prioMeta = v; invalidate(); }, onErr);
  db.doc("config/karta").onSnapshot(d => { const v = (d.exists && d.data()) || {}; const h0 = mapH(); S.karta = {hojd:v.hojd || 700, raknare:v.raknare || {}, rigg:v.rigg || null, flytt:v.flytt || {}}; if (mapH() !== h0) fit(); invalidate(); }, onErr);
})();
</script>
